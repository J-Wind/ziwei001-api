name: Deploy to Zeabur

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Zeabur
        run: |
          npx zeabur@latest deploy --token ${{ secrets.ZEABUR_API_TOKEN }}
